            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            background-color: #fff; /* Ensure background for select elements */

        .search-input:focus, .filter-select:focus, .style-select:focus {
            outline: none;
            border-color: #3b82f6; /* blue-500 */
        }
        /* Custom arrow for select elements */

            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22%234A5568%22%3E%3Cpath%20fill-rule%3D%22evenodd%22%20d%3D%22M5.293%207.293a1%201%200%20011.414%200L10%2010.586l3.293-3.293a1%201%200%20111.414%201.414l-4%204a1%201%200%2001-1.414%200l-4-4a1%201%200%20010-1.414z%22%20clip-rule%3D%22evenodd%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }
        .bibliography-list {
            margin-top: 2rem;
        }
        .bibliography-item {
            background-color: #f9fafb; /* gray-50 */
            border: 1px solid #e5e7eb; /* gray-200 */
            border-radius: 8px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .bibliography-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
        }
        .bibliography-item strong {
            color: #1a202c; /* gray-900 */
            font-weight: 600;
        }
        .bibliography-item span {
            color: #4a5568; /* gray-700 */
        }
        .no-results {
            text-align: center;
            color: #718096; /* gray-500 */
            font-size: 1.125rem; /* text-lg */
            padding: 2rem;
            border: 1px dashed #cbd5e0; /* gray-300 */
            border-radius: 8px;
            margin-top: 2rem;
        }
        /* Responsive grid for filters and search */
        .grid-cols-1-md-2-lg-3 {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        @media (min-width: 768px) {
            .grid-cols-1-md-2-lg-3 {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (min-width: 1024px) {
            .grid-cols-1-md-2-lg-3 {
                grid-template-columns: 1fr 1fr 1fr;

    <div class="container">
        <h1 class="header">Base de Datos de Bibliografía</h1>

        <div class="grid-cols-1-md-2-lg-3 gap-4 mb-6">
            <div>
                <label for="search" class="block text-sm font-medium text-gray-700 mb-2">Buscar:</label>
                <input type="text" id="search" placeholder="Buscar por autor, título o editorial..." class="search-input">
            </div>
            <div>
                <label for="filter" class="block text-sm font-medium text-gray-700 mb-2">Filtrar por:</label>
                <select id="filter" class="filter-select">
                    <option value="all">Todo</option>
                    <option value="author">Autor</option>
                    <option value="title">Título</option>
                    <option value="publisher">Editorial/Lugar</option>
                </select>
            </div>
            <div>
                <label for="citation-style" class="block text-sm font-medium text-gray-700 mb-2">Estilo de Citación:</label>
                <select id="citation-style" class="style-select">
                    <option value="original">Original</option>
                    <option value="apa7">APA 7ma Edición</option>
                    <option value="chicago">Chicago (Notas y Bibliografía)</option>
                    <option value="icontec">ICONTEC</option>
                </select>
            </div>
        </div>

        <div id="bibliography-list" class="bibliography-list">
            <!-- Los elementos de la bibliografía se cargarán aquí -->
        </div>
    </div>

            { author: "Toch, E.", title: "Elementos constitutivos de la Música.", publisher: "Barcelona: Idea Book S.A.", year: "2001" },
            { author: "Toro Echeverri, J. C.", title: "Repositorio Institucional Universidad EAFIT.", publisher: "https://repository.eafit.edu.co/handle/10784/515", year: "2012" },
            { author: "Ulehla, L.", title: "Contemporary Harmony.", publisher: "Advance Music.", year: "1994" },
            { author: "Valencia Rincón, V. F.", title: "Cartilla de Arreglos Para Banda Nivel 1.", publisher: "Ministerio de Cultura.", year: "2005" },
            { author: "Vergés, L.", title: "El lenguaje de la armonía: de los inicios a la actualidad.", publisher: "Boileau, Editorial de Música.", year: "2007" },
            { author: "Vergés, L.", title: "El lenguaje de la armonía: de los inicios a la actualidad. Libro de ejercicios.", publisher: "Boileau, Editorial de Música.", year: "2011" },
            { author: "Villa Rojo, J.", title: "Notación Y Grafía Musical En El Siglo XX.", publisher: "Madrid: Iberautor Promociones Culturales.", year: "2003" },
            { author: "Williams, A.", title: "Teoría De La Música.", publisher: "Buenos Aires: La Quena.", year: "1981" },
            { author: "Wright , R.", title: "Inside the Score.", publisher: "KendorMusic.", year: "1982" },
            { author: "Yepes Londoño, G.", title: "Tratado Del Lenguaje Tonal.", publisher: "Bogotá: Autoreseditores.com.", year: "2014" },
            { author: "Zamacois, J.", title: "Teoría De La Música Dividida En Cursos.", publisher: "Barcelona: Labor, S.A.", year: "1986" },
            { author: "Zamacois, J.", title: "Tratado De Armonía I.", publisher: "Barcelona: Idea Books, S.A.", year: "2002" },
            { author: "Zamacois, J.", title: "Tratado De Armonía II.", publisher: "Barcelona: Idea Books, S.A.", year: "2002" },
            { author: "Zamacois, J.", title: "Tratado de Armonía III.", publisher: "Barcelona: Idea Books, S.A.", year: "2002" }
        ];

        const searchInput = document.getElementById('search');
        const filterSelect = document.getElementById('filter');
        const citationStyleSelect = document.getElementById('citation-style'); // Nuevo selector
        const bibliographyList = document.getElementById('bibliography-list');

        // Función para formatear el nombre del autor para APA, Chicago e ICONTEC
        function formatAuthorName(authorString, style) {
            const authors = authorString.split(',').map(name => name.trim());
            let formattedAuthors = [];

            if (style === 'apa7') {
                for (let i = 0; i < authors.length; i++) {
                    const parts = authors[i].split(' ');
                    const lastName = parts[0];
                    const initials = parts.slice(1).map(part => part[0] + '.').join('');
                    formattedAuthors.push(`${lastName}, ${initials}`);
                }
                if (formattedAuthors.length > 1) {
                    const lastAuthor = formattedAuthors.pop();
                    return formattedAuthors.join(', ') + ' & ' + lastAuthor;
                }
                return formattedAuthors[0];
            } else if (style === 'chicago') {
                for (let i = 0; i < authors.length; i++) {
                    const parts = authors[i].split(' ');
                    const lastName = parts[0];
                    const firstName = parts.slice(1).join(' '); // Simple join for first name
                    formattedAuthors.push(`${lastName}, ${firstName}`);
                }
                if (formattedAuthors.length > 1) {
                    const lastAuthor = formattedAuthors.pop();
                    return formattedAuthors.join(', ') + ', and ' + lastAuthor;
                }
                return formattedAuthors[0];
            } else if (style === 'icontec') {
                // ICONTEC: APELLIDO, Nombre; APELLIDO, Nombre.
                for (let i = 0; i < authors.length; i++) {
                    const parts = authors[i].split(' ');
                    const lastName = parts[0].toUpperCase(); // Apellido en mayúsculas
                    const firstName = parts.slice(1).join(' ');
                    formattedAuthors.push(`${lastName}, ${firstName}`);
                }
                return formattedAuthors.join('; ');
            }
            return authorString; // Default for original style
        }

        // Función para formatear un elemento de la bibliografía según el estilo seleccionado
        function formatBibliographyItem(item, style) {
            switch (style) {
                case 'apa7':
                    const apaAuthor = formatAuthorName(item.author, 'apa7');
                    const apaYear = item.year === 'n.d.' ? '(s.f.).' : `(${item.year}).`; // s.f. para sin fecha
                    return `${apaAuthor} ${apaYear} <i>${item.title}</i>. ${item.publisher}`;
                case 'chicago':
                    const chicagoAuthor = formatAuthorName(item.author, 'chicago');
                    const chicagoYear = item.year === 'n.d.' ? '' : `, ${item.year}`;
                    // Chicago often omits place if publisher includes it, but for simplicity, we'll keep publisher as is.
                    return `${chicagoAuthor}. <i>${item.title}</i>. ${item.publisher}${chicagoYear}.`;
                case 'icontec':
                    const icontecAuthor = formatAuthorName(item.author, 'icontec');
                    const icontecYear = item.year === 'n.d.' ? '' : `, ${item.year}`;
                    // ICONTEC: APELLIDO, Nombre. TÍTULO. Ciudad: Editorial, Año.
                    // Assuming publisher field contains "Ciudad: Editorial."
                    return `${icontecAuthor}. <i>${item.title}</i>. ${item.publisher}${icontecYear}.`;
                case 'original':
                default:
                    return `<strong>Autor:</strong> <span>${item.author}</span><br>
                            <strong>Título:</strong> <span>${item.title}</span><br>
                            <strong>Editorial/Lugar:</strong> <span>${item.publisher}</span><br>
                            <strong>Año:</strong> <span>${item.year}</span>`;
            }
        }

        // Función para renderizar la bibliografía
        function renderBibliography(data) {
            bibliographyList.innerHTML = ''; // Limpiar la lista actual
            if (data.length === 0) {
                bibliographyList.innerHTML = '<div class="no-results">No se encontraron resultados.</div>';
                return;
            }
            const selectedStyle = citationStyleSelect.value; // Obtener el estilo seleccionado
            data.forEach(item => {
                const div = document.createElement('div');
                div.classList.add('bibliography-item');
                div.innerHTML = formatBibliographyItem(item, selectedStyle); // Usar la función de formato
                bibliographyList.appendChild(div);
            });
        }

        // Función para filtrar y buscar
        function filterAndSearch() {
            const searchTerm = searchInput.value.toLowerCase();
            const filterBy = filterSelect.value;

            const filteredData = bibliographyData.filter(item => {
                if (filterBy === 'all') {
                    return (
                        item.author.toLowerCase().includes(searchTerm) ||
                        item.title.toLowerCase().includes(searchTerm) ||
                        item.publisher.toLowerCase().includes(searchTerm) ||
                        item.year.toLowerCase().includes(searchTerm)
                    );
                } else {
                    // Ensure the property exists before calling toLowerCase()
                    return item[filterBy] && item[filterBy].toLowerCase().includes(searchTerm);
                }
            });
            renderBibliography(filteredData);
        }

        // Event Listeners
        searchInput.addEventListener('input', filterAndSearch);
        filterSelect.addEventListener('change', filterAndSearch);
        citationStyleSelect.addEventListener('change', filterAndSearch); // Escuchar cambios en el estilo de citación

        // Renderizar la bibliografía inicial al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            renderBibliography(bibliographyData);
        });
    </script>
